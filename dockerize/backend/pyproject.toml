[project]
name = "mini-rag-course"
version = "0.1.0"
description = "A beginner mini RAG course app using Mistral embeddings."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "mistralai>=1.9.3",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
